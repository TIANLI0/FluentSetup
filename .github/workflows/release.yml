name: Release

# Push a tag vX.Y.Z (matching Directory.Build.props, src/Bootstrapper/main.cpp and packaging/fluentsetup.json, with a
# "## [X.Y.Z]" section in CHANGELOG.md) to build, test and publish:
#   fluentsetup-X.Y.Z-win-x64.zip       CLI + installer runtimes x64 and arm64 (used by the GitHub Action in action.yml)
#   fluentsetup-X.Y.Z-linux-x64.tar.gz  the same for Linux (Action on ubuntu runners)
#   fluentsetup-X.Y.Z-osx-arm64.tar.gz  the same for macOS on Apple silicon (Action on macos runners)
#   FluentSetup-X.Y.Z-Setup.exe         Builder app + CLI
#   FluentSetup.*.X.Y.Z.nupkg           NuGet packages (Builder.Core, Cli, MSBuild), also pushed to nuget.org: with
#                                       Trusted Publishing when the NUGET_USER repository variable names the nuget.org
#                                       account (policy for this repo and release.yml), else with a NUGET_API_KEY secret
#   SHA256SUMS.txt
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true
      nuget-only:
        description: Only push the .nupkg files already attached to that release to nuget.org (no rebuild)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # nuget.org Trusted Publishing (a short-lived key instead of a stored secret)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.nuget-only }}
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Tag $env:TAG is not vX.Y.Z" }
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)')
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $m.Groups[1].Value.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platforms x64,ARM64

      - name: Tests (native, managed, end-to-end)
        shell: pwsh
        run: |
          ./out/bin/x64/Release/FluentSetup.Tests.Native.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Builder.Core.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Integration/e2e.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $assets = Get-ChildItem out/release -File | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            $flags = @('--title', "FluentSetup $env:VERSION", '--notes-file', "$env:RUNNER_TEMP\notes.md", '--verify-tag')
            if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' } else { $flags += '--latest' }
            gh release create $env:TAG @assets @flags
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # "uses: TIANLI0/FluentSetup@v1" follows the latest 1.x release, "@latest" the latest release.
      - name: Move the major and latest tags
        if: steps.version.outputs.prerelease == 'false'
        shell: pwsh
        run: |
          $major = 'v' + ('${{ steps.version.outputs.version }}' -split '\.')[0]
          foreach ($tag in $major, 'latest') {
            git tag -f $tag HEAD
            git push -f origin "refs/tags/${tag}"
          }

      # The same .nupkg files as on the release page (symbols go along with Builder.Core). Re-runs skip what is there.
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Host '::notice::Neither the NUGET_USER variable (Trusted Publishing) nor a NUGET_API_KEY secret is set: the NuGet packages are only attached to the release.'
            exit 0
          }
          foreach ($package in Get-ChildItem out/release -Filter *.nupkg) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # A release published before nuget.org was set up: push the packages it already carries, checked against its
  # SHA256SUMS.txt, without building anything again.
  nuget:
    if: ${{ inputs.nuget-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D pkgs -p '*.nupkg' -p '*.snupkg' -p SHA256SUMS.txt
          cd pkgs
          sed 's/\r$//' SHA256SUMS.txt | grep -E '\.s?nupkg$' | sha256sum -c -

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo '::error::Set the NUGET_USER variable (Trusted Publishing) or a NUGET_API_KEY secret.'; exit 1; fi
          for package in pkgs/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
