name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'src/Setup.WinUI/packages.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (native runtime, WinUI front end, Builder.Core, CLI, Builder GUI, tests)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Native unit tests
        shell: pwsh
        run: |
          ./out/bin/x64/Release/FluentSetup.Tests.Native.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Managed unit tests
        shell: pwsh
        run: dotnet test tests/Builder.Core.Tests -c Release --no-build --logger "trx;LogFileName=managed.trx" --results-directory out/test-results

      - name: End-to-end install / upgrade / rollback / uninstall
        shell: pwsh
        run: ./tests/Integration/e2e.ps1

      - name: Size report (fails above the 5 MiB overhead budget)
        shell: pwsh
        run: ./scripts/size-report.ps1 -Json out/size-report.json

      # Needs an interactive desktop session. GitHub-hosted Windows runners provide one; the WinUI front end is skipped
      # there because the Windows App Runtime is not installed (Setup.exe would fall back to Win32 anyway).
      - name: UI tests (UI Automation)
        shell: pwsh
        continue-on-error: true
        run: ./tests/UI/ui-tests.ps1

      - name: Release assets (dry run)
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluentsetup-x64
          if-no-files-found: ignore
          path: |
            out/release/
            out/size-report.json
            out/test-results/
            out/e2e/logs/
            out/ui-tests/logs/

  action:
    # The GitHub Action (action.yml) the way apps use it: download the latest release, verify it, put it on PATH.
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: fluentsetup
        uses: ./
      - name: fluentsetup is on PATH
        shell: pwsh
        run: |
          fluentsetup --version
          if ($LASTEXITCODE -ne 0) { throw 'fluentsetup is not on PATH' }
          Write-Host "FluentSetup ${{ steps.fluentsetup.outputs.version }} at ${{ steps.fluentsetup.outputs.path }}"
