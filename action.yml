name: Setup FluentSetup
description: Installs the fsetup CLI (also on PATH as fluentsetup; self-contained, with the installer runtime) and puts it on PATH; optionally builds a project. Windows, Linux x64 and macOS arm64 runners.
author: TIANLI0
branding:
  icon: package
  color: blue

inputs:
  version:
    description: >-
      FluentSetup version, e.g. 1.0.0. Default: the version of the action ref (uses: TIANLI0/FluentSetup@v1.5.0),
      else (@latest, @v1, a branch) the latest release.
    required: false
    default: ''
  project:
    description: >-
      Optional project file (fluentsetup.json) to build right away, e.g. installer/fluentsetup.json. Without it the
      action only installs the CLI.
    required: false
    default: ''
  defines:
    description: >-
      Values for $(Name) in the project, one Name=Value per line (fsetup build -D), e.g. Version=1.5.0 (or the release tag from the workflow).
    required: false
    default: ''
  args:
    description: Further fsetup build arguments, e.g. "--arch arm64 --sign".
    required: false
    default: ''

outputs:
  path:
    description: Full path of fsetup.exe (fsetup on Linux and macOS).
    value: ${{ steps.install.outputs.path }}
  version:
    description: The installed version.
    value: ${{ steps.install.outputs.version }}
  setup-path:
    description: Full path of the built Setup.exe (when project is set).
    value: ${{ steps.build.outputs.setup-path }}
  setup-sha256:
    description: SHA-256 of the built Setup.exe (when project is set), e.g. for release notes or an update feed.
    value: ${{ steps.build.outputs.setup-sha256 }}
  app-version:
    description: The app version the Setup.exe installs (when project is set).
    value: ${{ steps.build.outputs.app-version }}

runs:
  using: composite
  steps:
    - id: install
      shell: pwsh
      env:
        FS_VERSION: ${{ inputs.version }}
        FS_REF: ${{ github.action_ref }}
        FS_REPO: ${{ github.action_repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $repo = if ($env:FS_REPO) { $env:FS_REPO } else { 'TIANLI0/FluentSetup' }
        $version = $env:FS_VERSION.Trim().TrimStart('v')
        if (-not $version -and $env:FS_REF -match '^v?(\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?)$') { $version = $Matches[1] }
        $headers = @{ 'User-Agent' = 'fluentsetup-action'; 'Accept' = 'application/vnd.github+json' }
        if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $env:GH_TOKEN" }
        if (-not $version) {
          $latest = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$repo/releases/latest"
          $version = $latest.tag_name.TrimStart('v')
        }
        # Windows x64 (also used on Windows Arm64), Linux x64, macOS Apple silicon.
        $arch = "$env:RUNNER_ARCH".ToUpperInvariant()
        if ($IsWindows) { $rid = 'win-x64'; $ext = 'zip'; $suffix = '.exe' }
        elseif ($IsLinux -and $arch -eq 'X64') { $rid = 'linux-x64'; $ext = 'tar.gz'; $suffix = '' }
        elseif ($IsMacOS -and $arch -eq 'ARM64') { $rid = 'osx-arm64'; $ext = 'tar.gz'; $suffix = '' }
        else { throw "FluentSetup has no build for this runner ($([Runtime.InteropServices.RuntimeInformation]::OSDescription), $arch). Use a Windows, Linux x64 or macOS arm64 runner." }
        $name = "fluentsetup-$version-$rid.$ext"
        $base = "https://github.com/$repo/releases/download/v$version"
        $dir = Join-Path $env:RUNNER_TEMP 'fsetup' $version
        New-Item -ItemType Directory -Force $dir | Out-Null
        $archive = Join-Path $env:RUNNER_TEMP $name
        Write-Host "FluentSetup $version ($rid) from $base"
        try {
          Invoke-WebRequest -UseBasicParsing -Headers @{ 'User-Agent' = 'fluentsetup-action' } "$base/$name" -OutFile $archive
        } catch {
          if (-not $IsWindows) { throw "Could not download $name ($($_.Exception.Message)). Linux and macOS builds exist from FluentSetup 1.2.0 on." }
          throw
        }
        # Saved to a file and read as text: GitHub serves release files as application/octet-stream, for which
        # Invoke-WebRequest returns .Content as bytes on PowerShell 7.
        $sumsFile = Join-Path $env:RUNNER_TEMP "fluentsetup-$version-SHA256SUMS.txt"
        Invoke-WebRequest -UseBasicParsing -Headers @{ 'User-Agent' = 'fluentsetup-action' } "$base/SHA256SUMS.txt" -OutFile $sumsFile
        $expected = (Get-Content $sumsFile | Where-Object { $_ -match "^([0-9a-fA-F]{64})\s+\*?$([regex]::Escape($name))\s*$" } | ForEach-Object { $Matches[1] }) | Select-Object -First 1
        if (-not $expected) { throw "SHA256SUMS.txt has no entry for $name" }
        $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
        if ($actual -ne $expected.ToUpperInvariant()) { throw "SHA-256 mismatch for ${name}: $actual, expected $expected" }
        if ($ext -eq 'zip') {
          Expand-Archive $archive -DestinationPath $dir -Force
        } else {
          tar -xzf $archive -C $dir
          if ($LASTEXITCODE -ne 0) { throw "Could not extract $name" }
        }
        # Both names on PATH: fsetup and fluentsetup, its original name (older releases ship only fluentsetup; the
        # Windows zip only fsetup.exe). A hard link costs no space.
        $exe = Join-Path $dir "fsetup$suffix"
        $alias = Join-Path $dir "fluentsetup$suffix"
        if (-not (Test-Path $exe)) { New-Item -ItemType HardLink -Path $exe -Target $alias | Out-Null }
        elseif (-not (Test-Path $alias)) { New-Item -ItemType HardLink -Path $alias -Target $exe | Out-Null }
        & $exe --version
        if ($LASTEXITCODE -ne 0) { throw 'fsetup does not start' }
        Add-Content $env:GITHUB_PATH $dir
        "path=$exe" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - id: build
      if: ${{ inputs.project != '' }}
      shell: pwsh
      env:
        FS_EXE: ${{ steps.install.outputs.path }}
        FS_PROJECT: ${{ inputs.project }}
        FS_DEFINES: ${{ inputs.defines }}
        FS_ARGS: ${{ inputs.args }}
      run: |
        $ErrorActionPreference = 'Stop'
        $report = Join-Path $env:RUNNER_TEMP 'fluentsetup-report.json'
        [string[]] $arguments = @('build', $env:FS_PROJECT, '--report', $report)
        foreach ($line in ($env:FS_DEFINES -split "`r?`n")) { if ($line.Trim()) { $arguments += @('-D', $line.Trim()) } }
        # Further arguments split like a command line (quotes keep spaces).
        if ($env:FS_ARGS.Trim()) { $arguments += [regex]::Matches($env:FS_ARGS, '"([^"]*)"|(\S+)') | ForEach-Object { if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value } } }
        & $env:FS_EXE @arguments
        if ($LASTEXITCODE -ne 0) { throw "fsetup build failed (exit code $LASTEXITCODE)" }
        $r = Get-Content $report -Raw | ConvertFrom-Json
        "setup-path=$($r.outputPath)" >> $env:GITHUB_OUTPUT
        "setup-sha256=$($r.sha256)" >> $env:GITHUB_OUTPUT
        "app-version=$($r.version)" >> $env:GITHUB_OUTPUT
        Write-Host "Setup.exe: $($r.outputPath) (SHA-256 $($r.sha256))"
